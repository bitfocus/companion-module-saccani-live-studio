name: Node CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js 22.x
        # Matches the node22 runtime in companion/manifest.json
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Prepare Environment
        run: |
          corepack enable
      - name: Prepare module
        run: |
          yarn install
        env:
          CI: true
      - name: Check types
        run: |
          yarn check
        env:
          CI: true
      - name: Build and test
        run: |
          yarn test
        env:
          CI: true
