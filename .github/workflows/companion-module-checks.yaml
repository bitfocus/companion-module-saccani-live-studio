name: Companion Module Checks

on:
  push:

jobs:
  check:
    name: Check module

    # The shared workflow grants its job only packages: read, so checkout cannot read a private
    # repository. Run it on the public bitfocus repository; private copies rely on Node CI.
    if: ${{ !contains(github.repository, 'companion-module-template-') && !github.event.repository.private }}

    permissions:
      packages: read

    uses: bitfocus/actions/.github/workflows/module-checks.yaml@main
    # with:
    #   upload-artifact: true # uncomment this to upload the built package as an artifact to this workflow that you can download and share with others

